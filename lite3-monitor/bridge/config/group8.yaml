# Robot profile: team group8 (hostname group8, ROS_DOMAIN_ID 8).
# Merged over default.yaml:  --config config/group8.yaml [--config config/local.yaml]
#
# Discovery 2026-11-23 (docs/discovery/discovery-20261123-151619.md): domain 8 is fed
# by /lite3_domain_bridge_8 and carries odometry, IMU, joints, sensors and "is alive"
# flags, but no /map, no dynamic /tf and no navigation topics. The team chose to run
# WITHOUT the map: pose comes from /leg_odom2 in its odometry frame.

identity:
  robot_name: "Lite3 group8"
  expected_hostname: "group8"
  expected_ros_domain_id: 8

frames:
  # No dynamic TF on domain 8: the odometry pose is the intended source, so missing
  # TF chains are shown as notes, not as faults.
  tf_required: false

layers:
  map:
    # The map appears by itself whenever slam_toolbox publishes /map on domain 8
    # (navigation running); otherwise the dashboard shows the odometry view.
    enabled: true

sim:
  # ./scripts/mac/start-sim.sh --profile group8 : simulator behaves like group8
  # (odometry only: no TF, map or navigation topics).
  odom_only: true

# Navigation / SLAM topics (Nav2, slam_toolbox, LIO) only exist while the team runs
# navigation. They are "optional_roles" (default.yaml): inactive and quiet when absent,
# switched on automatically when present. The robot's velocity command is
# /handle_state (geometry_msgs/Twist, ~200 Hz) - used for "commanded vs actual".
topics:
  cmd_vel:
    candidates: ["/handle_state", "/cmd_vel"]

# Ultrasound: std_msgs/Float64 in metres, 4.5 m = nothing in range (sensor maximum).
range_topics:
  - {name: "/us_publisher/ultrasound_distance", label: "Ultrasound (front)", warn_m: 0.5, crit_m: 0.25,
     max_m: 4.5, expected_hz: 200, min_hz: 50}

# The Raspberry Pi (hostname group8pi). Its ADDRESS is set in config/local.yaml on the
# NUC (git-ignored), e.g.:
#   peers:
#     - {name: "Raspberry Pi", host: "<pi-ip>", expected_hostname: "group8pi", stats_port: 8766}
