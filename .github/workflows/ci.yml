name: ci
on:
  push:
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: lite3-monitor/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # NUC (Ubuntu 22.04 / Humble) uses Python 3.10
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python ../tools/check_readonly.py

  web:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: lite3-monitor/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lite3-monitor/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
